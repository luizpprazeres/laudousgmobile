<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Cartografia venosa esquemática dos membros inferiores</title>
  <desc id="desc">
    SVG standalone enderecavel por segmento. Paciente em vista frontal: membro direito no lado esquerdo da imagem, membro esquerdo no lado direito.
    A safena parva, por ser posterior, foi representada como projecao postero-lateral visivel na vista frontal.
  </desc>

