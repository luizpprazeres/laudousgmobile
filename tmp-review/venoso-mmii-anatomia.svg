  <defs>
    <style>
      :root {
        --map-bg: #fbfaf7;
        --limb-fill: #eadfce;
        --limb-stroke: #d8c8b1;
        --text: #2f3742;
        --muted: #7c8795;
        --profundo-stroke: #255f9f;
        --superficial-stroke: #2f9d83;
        --juncao-stroke: #1f3f5f;
        --perfurante-stroke: #8b6f47;
        --seg-opacity: 1;
      }

      .surface { fill: var(--map-bg); }
      .limb { fill: var(--limb-fill); stroke: var(--limb-stroke); stroke-width: 2; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); font-size: 24px; font-weight: 700; letter-spacing: 0; }
      .subtle-label { fill: var(--muted); font-size: 15px; font-weight: 600; }
      .seg { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: var(--seg-opacity); }
      .seg[data-sys="profundo"] { stroke: var(--profundo-stroke); stroke-width: var(--profundo-width, 7); }
      .seg[data-sys="superficial"] { stroke: var(--superficial-stroke); stroke-width: var(--superficial-width, 5); }
      .seg[data-sys="juncao"] { stroke: var(--juncao-stroke); stroke-width: var(--juncao-width, 6); }
      .seg[data-sys="perfurante"] { stroke: var(--perfurante-stroke); stroke-width: var(--perfurante-width, 3.5); }
      .posterior-proj { stroke-dasharray: 8 7; opacity: .78; }
      .landmark { fill: var(--map-bg); stroke: currentColor; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
      .side-note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: 0; }
    </style>
  </defs>

